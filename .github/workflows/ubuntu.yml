name: Ubuntu Python
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - run: python -m pip install -e ./ubuntu
      - run: python -m unittest discover -s ubuntu/tests -v
      - run: python -m compileall -q ubuntu/cicada_linux
      - run: QT_QPA_PLATFORM=offscreen python ubuntu/tests/smoke_ui.py
  capture:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: pulseaudio
            packages: pulseaudio
          - server: pipewire
            packages: pipewire pipewire-pulse wireplumber
    steps:
      - uses: actions/checkout@v4
      - name: Install audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon pulseaudio-utils ${{ matrix.packages }}
      - name: Test capture from a fixed source
        run: dbus-run-session -- bash ubuntu/tests/run_live_capture.sh ${{ matrix.server }}
