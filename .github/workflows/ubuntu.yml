name: Ubuntu Python
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./ubuntu
      - run: python -m unittest discover -s ubuntu/tests -v
      - run: python -m compileall -q ubuntu/cicada_linux
      - run: QT_QPA_PLATFORM=offscreen python ubuntu/tests/smoke_ui.py
